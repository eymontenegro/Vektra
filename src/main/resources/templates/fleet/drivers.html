<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Conductores')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="page-header">
        <div>
            <h1>Conductores</h1>
            <p class="muted">Conductores registrados, ordenados por apellido.</p>
        </div>
        <a href="/admin/drivers/new" class="btn btn-primary">Añadir conductor</a>
    </div>

    <section class="card card-flush">
        <p class="empty-state" th:if="${#lists.isEmpty(drivers)}">Todavía no hay conductores registrados.</p>
        <div class="table-wrap" th:unless="${#lists.isEmpty(drivers)}">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Cédula</th><th scope="col">Nombre</th><th scope="col">Apellido</th>
                    <th scope="col">Licencia</th><th scope="col">Teléfono</th><th scope="col">Ruta</th>
                    <th scope="col">Estado</th><th scope="col">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${drivers}" th:with="driver=${row.driver()}">
                    <td th:text="${driver.nationalId}">1001234567</td>
                    <td th:text="${driver.name}">Carlos</td>
                    <td th:text="${driver.lastName}">Pérez</td>
                    <td th:text="${driver.licenseNumber} ?: '—'">LIC-0001</td>
                    <td th:text="${driver.phone} ?: '—'">3001112233</td>
                    <td class="route-label" th:text="${row.routeLabel()}">Ruta</td>
                    <td>
                        <span th:class="${driver.active} ? 'badge badge-ok' : 'badge badge-off'"
                              th:text="${driver.status.displayName}">Activo</span>
                    </td>
                    <td>
                        <div class="actions">
                            <form method="post" th:action="'/admin/drivers/' + ${driver.id} + '/status'">
                                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-outline btn-small"
                                        th:text="${driver.active} ? 'Desactivar' : 'Activar'">Desactivar</button>
                            </form>
                            <form method="post" th:action="'/admin/drivers/' + ${driver.id} + '/delete'"
                                  th:attr="data-confirm=${'¿Seguro que quieres borrar a ' + driver.fullName + ' - ' + driver.nationalId + '?'}"
                                  data-confirm-again="Esta acción no se puede deshacer. ¿Borrar de todas formas?">
                                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-danger-outline btn-small">Borrar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
