<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container container-narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form method="post" th:action="${action}" class="card form" data-validate>
        <div class="card-title"><h1 th:text="${pageTitle}">AÃ±adir vehÃ­culo</h1></div>

        <th:block th:if="${error}"><div th:replace="~{fragments/layout :: formError(${error})}"></div></th:block>
        <th:block th:if="${#lists.isEmpty(drivers)}"><div th:replace="~{fragments/layout :: formError('Primero registra un conductor: todo vehÃ­culo necesita uno.')}"></div></th:block>
        <input type="hidden" name="_csrf" th:value="${csrfToken}">

        <div class="form-grid cols-3">
            <div>
                <label for="plate">Placa</label>
                <input id="plate" name="plate" required maxlength="15" placeholder="Ej. VKT-003" th:value="${form.plate}"
                       data-message-required="La placa es obligatoria.">
            </div>
            <div>
                <label for="brand">Marca (opcional)</label>
                <input id="brand" name="brand" maxlength="60" placeholder="Ej. Siemens" th:value="${form.brand}">
            </div>
            <div>
                <label for="model">Modelo (opcional)</label>
                <input id="model" name="model" maxlength="60" placeholder="Ej. Inspiro" th:value="${form.model}">
            </div>
        </div>

        <div class="form-grid cols-2">
            <div>
                <label for="year">AÃ±o</label>
                <input id="year" name="year" type="number" required step="1" th:value="${form.year}"
                       th:attr="min=${minYear},max=${maxYear},data-message-range=${'El aÃ±o debe estar entre ' + minYear + ' y ' + maxYear + '.'}"
                       data-message-required="El aÃ±o es obligatorio.">
            </div>
            <div>
                <label for="capacity">Capacidad</label>
                <input id="capacity" name="capacity" type="number" required min="1" max="32767" step="1"
                       th:value="${form.capacity}" data-message-required="La capacidad es obligatoria."
                       data-message-range="La capacidad debe ser mayor que cero.">
            </div>
        </div>

        <div class="form-grid cols-2">
            <div>
                <label for="line">LÃ­nea</label>
                <div class="select-with-dot">
                    <span class="line-dot" id="lineDot" aria-hidden="true"></span>
                    <select id="line" name="line" required data-message-required="Selecciona la lÃ­nea." data-line-select>
                        <option th:each="line : ${lines}" th:value="${line.name()}" th:text="${line.displayName}"
                                th:attr="data-color=${line.hexCode}"
                                th:selected="${line.name() == form.line}">Roja</option>
                    </select>
                </div>
                <p class="hint">Debe ser la misma lÃ­nea de la ruta asignada al conductor.</p>
            </div>
            <div>
                <label for="driverId">Conductor</label>
                <select id="driverId" name="driverId" required data-message-required="Selecciona el conductor.">
                    <option value="">Elige un conductor</option>
                    <option th:each="driver : ${drivers}" th:value="${driver.id()}" th:text="${driver.label()}"
                            th:selected="${#strings.toString(driver.id()) == form.driverId}">Conductor</option>
                </select>
            </div>
        </div>

        <div class="form-actions">
            <a href="/admin/vehicles" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary" data-busy-text="Guardandoâ€¦">Guardar</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
