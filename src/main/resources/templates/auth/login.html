<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<main class="auth-layout">
    <section class="auth-brand" aria-hidden="true">
        <div class="auth-brand-content">
            <svg th:replace="~{fragments/layout :: logo(150)}"></svg>
            <p class="auth-brand-name">Vektra</p>
            <p class="auth-brand-tagline">Sistema de Metro Inteligente</p>
        </div>
        <!-- Silueta de la ciudad, solo decorativa. -->
        <svg class="skyline" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
            <path fill="#2A2727" d="M0 140V96h18V70h14v26h10V58h20v38h8V80h16v16h12V40l14-10 14 10v56h10V66h18v30h8V50h22v46h10V76h14v20h12V62h16v34h10V30h8v-8h6v8h8v66h12V72h18v24h10V84h14v12h12V56h20v84z"></path>
            <path fill="#353131" d="M0 140v-26h30v-14h22v14h26v-20h18v20h30v-12h20v12h34v-24h16v24h28v-16h22v16h30v-20h18v20h24v-12h20v12h28v-18h20v18h14v26z"></path>
        </svg>
    </section>

    <section class="auth-form-side">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <form method="post" action="/login" class="card form" data-validate>
            <div class="auth-mobile-brand"><svg th:replace="~{fragments/layout :: logo(56)}"></svg></div>
            <div class="card-title">
                <h1>Iniciar sesión</h1>
                <p class="muted">Accede a Vektra</p>
            </div>

            <th:block th:if="${error}"><div th:replace="~{fragments/layout :: formError(${error})}"></div></th:block>
            <input type="hidden" name="_csrf" th:value="${csrfToken}">

            <label for="userType">Tipo de usuario</label>
            <select id="userType" name="userType" data-toggle-register>
                <option value="PASSENGER" th:selected="${userType == 'PASSENGER'}">Pasajero regular</option>
                <option value="ADMIN" th:selected="${userType == 'ADMIN'}">Administrador</option>
            </select>

            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" required maxlength="150"
                   autocomplete="username" placeholder="tu correo@ejemplo.com" th:value="${email}"
                   data-message-required="Escribe tu correo electrónico."
                   data-message-type="El correo no tiene un formato válido.">

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="current-password"
                   placeholder="Ingresa tu contraseña"
                   data-message-required="Escribe tu contraseña.">

            <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>

            <div class="register-hint" id="registerHint">
                <p>¿No tienes una cuenta? Crea una:</p>
                <a href="/register" class="btn btn-outline">Crear cuenta</a>
            </div>
        </form>
        <img src="/images/login-mascot.png" alt="" class="auth-mascot">
    </section>
</main>
</body>
</html>
