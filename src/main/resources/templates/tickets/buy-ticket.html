<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Comprar ticket')}"></head>
    <body>
        <header th:replace="~{fragments/layout :: navbar}"></header>
        <main class="container container-narrow">
            <div th:replace="~{fragments/layout :: flash}"></div>
            <form method="post" action="/tickets/buy" class="card form" datavalidate id="buyTicketForm">
                <div class="card-title">
                    <h1>Comprar un ticket</h1>
                    <p class="muted">Elige tu origen y tu destino. El ticket
                        llegará a tu correo.</p>
                </div>
                <p class="info-box">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"
                         fill="none" stroke="currentColor" stroke-width="1.8" strokelinecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18"
                         height="14" rx="2"></rect><circle cx="9" cy="11" r="2.2"></circle><path
                         d="M5.8 16c.6-1.6 1.8-2.4 3.2-2.4s2.6.8 3.2 2.4M14.5 10h4M14.5 13.5h3">
                    </path></svg>
                    <span>Comprando como <strong
                            th:text="${currentUser.name()}">Ana Ruiz</strong>
                        (<span
                            th:text="${currentUser.email()}">ana@correo.com</span>)</span>
                </p>
                <th:block th:if="${error}"><div th:replace="~{fragments/layout ::
                                                formError(${error})}"></div></th:block>
                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                <div class="form-grid cols-2">
                    <div>
                        <label for="originId">Estación de origen</label>
                        <select id="originId" name="originId" required datamessage-required="Selecciona la estación de origen.">
                            <option value="">Elige una estación</option>
                            <option th:each="station : ${stations}"
                                    th:value="${station.id}" th:text="${station.name}"
                                    th:selected="${#strings.toString(station.id)
                                    == originId}">Estación</option>
                        </select>
                    </div>
                    <div>
                        <label for="destinationId">Estación de destino</label>
                        <select id="destinationId" name="destinationId" required
                                data-message-required="Selecciona la estación de destino.">
                            <option value="">Elige una estación</option>
                            <option th:each="station : ${stations}"
                                    th:value="${station.id}" th:text="${station.name}"
                                    th:selected="${#strings.toString(station.id)
                                    == destinationId}">Estación</option>
                        </select>
                    </div>
                </div>
                <p class="route-info" aria-live="polite">
                    <span id="routeDot" class="line-dot" aria-hidden="true">
                    </span>
                    <span id="routeInfo">Elige la estación de origen y la de
                        destino.</span>
                </p>
                <p class="price">Precio: <span th:text="${fare}">$2.500</span></p>
                <button type="submit" class="btn btn-primary btn-block btn-lg"
                        data-busy-text="Comprando…">Comprar ticket</button>
            </form>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
        <script src="/js/buy-ticket.js"></script>
    </body>
</html>
