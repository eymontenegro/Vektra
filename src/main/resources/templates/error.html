<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Algo salió mal')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>
<main class="container">
    <section class="card error-page" role="alert">
        <img src="/images/error-view-mascot.png" alt="" class="error-mascot">
        <div>
            <p class="error-code" th:text="'Error ' + ${status}">Error 404</p>
            <h1>Algo salió mal</h1>
            <p th:text="${message}">La página que buscas no existe.</p>
            <a href="/map" class="btn btn-primary btn-lg" th:if="${currentUser != null}">Ir al mapa</a>
            <a href="/login" class="btn btn-primary btn-lg" th:if="${currentUser == null}">Iniciar sesión</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
